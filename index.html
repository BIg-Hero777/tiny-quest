<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Tiny Quest</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="app">
<section class="hero">
<p class="tag">✦ TINY QUEST</p>
<h1>Turn ordinary moments<br/>into tiny adventures.</h1>
<p class="intro">No login. No pressure. Just one small quest.</p>
</section>
<section class="panel">
<div class="controls">
<label>Time<select id="time"><option value="5">5 minutes</option><option value="15" selected>15 minutes</option><option value="30">30 minutes</option></select></label>
<label>Place<select id="place"><option value="home">Home</option><option value="outside">Outside</option><option value="any" selected>Anywhere</option></select></label>
<label>Energy<select id="energy"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
</div>
<button id="generate">🎲 Create my quest</button>
<button id="today" class="secondary">☀ Today's Quest</button>
<div id="card" class="quest">Choose a quest to begin.</div>
<div class="actions"><button id="done">✓ Complete</button><button id="share">↗ Share</button></div>
</section>
<section class="trail"><h2>Your trail</h2><ul id="history"></ul></section>
</main>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
